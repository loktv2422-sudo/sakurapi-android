
name: Build SakuRapi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project
        run: |
          unzip -q SakuRapi-Android-APK-Kit-CloudBuild.zip
          cd sakurapi-kit
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SakuRapi-APK
          path: sakurapi-kit/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
